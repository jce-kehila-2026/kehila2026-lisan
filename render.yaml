# ─── Render Blueprint for Lisan's ai-service ────────────────────────────────
# Backend + frontend are deployed on Firebase (Cloud Functions + Hosting) —
# this Blueprint ONLY covers the Python/FastAPI ai-service, plus the Redis
# instance it uses for caching / session memory.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
#
# IMPORTANT — ai-service is a PUBLIC web service here (not private), because
# it must be reachable from Firebase Cloud Functions over the public internet
# (Firebase Functions run outside Render's private network, so they can't use
# Render's internal service-to-service networking). Security is enforced by
# the AI_SERVICE_INTERNAL_SECRET header check already built into the app
# (see ai-service/routes/chat.py: require_internal_service_secret /
# verify_jwt_token) — every request must carry the matching secret or a valid
# JWT, or it's rejected with 401/403.

services:
  # ── Managed Redis — caching + session memory for ai-service ─────────────
  - type: keyvalue
    name: lisan-redis
    plan: starter
    ipAllowList: []       # empty = only Render services in this workspace can reach it

  # ── AI service (FastAPI / Python) — PUBLIC, called by Firebase Functions ─
  - type: web
    name: lisan-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: starter
    healthCheckPath: /api/ai/health
    envVars:
      # Shared secret — MUST match the value set in backend/.env (Firebase
      # Functions) under the same key, or every request from the backend
      # will be rejected with 401.
      - key: AI_SERVICE_INTERNAL_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false

      # LLM — OpenRouter primary
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_API_KEYS
        sync: false          # paste your (rotated) OpenRouter key here
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_SITE_URL
        value: https://lisan.app
      - key: OPENROUTER_SITE_NAME
        value: Lisan

      # LLM — Gemini fallback (optional but recommended)
      - key: GEMINI_API_KEYS
        sync: false

      # Azure Speech — STT + pronunciation scoring
      - key: AZURE_SPEECH_KEY
        sync: false          # paste your rotated Azure Speech key here
      - key: AZURE_SPEECH_REGION
        value: swedencentral
      - key: STT_ENGINE
        value: azure
      - key: USE_AZURE_PRONUNCIATION
        value: "true"
      - key: MAX_AUDIO_SECONDS
        value: "30"
      - key: MAX_AUDIO_BYTES
        value: "26214400"

      # Redis (wired automatically from the lisan-redis service above)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lisan-redis
          property: connectionString

      # Backend callback (vocab tracking) + RAG transcript source.
      # The backend now lives on Firebase, e.g.:
      #   https://api-<hash>-uc.a.run.app   (Cloud Functions v2 direct URL), or
      #   https://<your-project>.web.app/api  (via Firebase Hosting rewrite)
      # Fill in whichever one your Firebase deploy actually uses.
      - key: BACKEND_URL
        sync: false
      - key: RAG_BACKEND_URL
        sync: false
      - key: RAG_TRANSCRIPTS_SOURCE
        value: auto

      - key: ENV_MODE
        value: production
      - key: LOG_PII_MODE
        value: hash
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # your Firebase Hosting URL, e.g. https://lisan-238bb.web.app

databases: []   # this project doesn't use Postgres — Firestore is the DB
