# ─── Render Blueprint for the Lisan stack ───────────────────────────────────
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
# Render will create 2 web services + 1 Redis instance and wire the URLs
# together automatically via `fromService`. You still need to open each
# service afterwards and fill in the "sync: false" secrets manually
# (Environment tab) — they are intentionally NOT stored in this file or git.
#
# NOTE: ai-service is a *private* service (no public URL) — only the backend
# can reach it, over Render's internal network, exactly like the ai-service
# container in docker-compose is only reachable from backend today.

services:
  # ── Managed Redis (replaces the `redis` container in docker-compose) ────
  - type: keyvalue
    name: lisan-redis
    plan: starter
    ipAllowList: []       # empty = only Render services in this workspace can reach it

  # ── AI service (FastAPI / Python) ──────────────────────────────────────
  - type: pserv
    name: lisan-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: starter
    envVars:
      - key: AI_SERVICE_INTERNAL_SECRET
        sync: false          # same value as the backend's AI_SERVICE_INTERNAL_SECRET
      - key: JWT_SECRET
        sync: false          # same value as the backend's JWT_SECRET

      # LLM — OpenRouter primary
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_API_KEYS
        sync: false          # paste your OpenRouter key here
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash-lite
      - key: OPENROUTER_SITE_URL
        value: https://lisan.app
      - key: OPENROUTER_SITE_NAME
        value: Lisan

      # LLM — Gemini fallback
      - key: GEMINI_API_KEYS
        sync: false

      # Azure Speech — STT + pronunciation scoring
      - key: AZURE_SPEECH_KEY
        sync: false          # paste Key 1 from the Azure Speech resource
      - key: AZURE_SPEECH_REGION
        value: swedencentral
      - key: STT_ENGINE
        value: azure
      - key: USE_AZURE_PRONUNCIATION
        value: "true"
      - key: MAX_AUDIO_SECONDS
        value: "30"
      - key: MAX_AUDIO_BYTES
        value: "26214400"

      # Redis (wired automatically from the lisan-redis service above)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lisan-redis
          property: connectionString

      # Backend callback + RAG source.
      # `hostport` gives "host:port" with NO scheme, but this code expects a
      # full URL (http://...), so fill these in manually after both services
      # exist: open lisan-backend → Connect tab → copy its internal address →
      # prefix with "http://". Example: http://lisan-backend:10000
      - key: BACKEND_URL
        sync: false
      - key: RAG_BACKEND_URL
        sync: false
      - key: RAG_TRANSCRIPTS_SOURCE
        value: auto

      - key: ENV_MODE
        value: production
      - key: LOG_PII_MODE
        value: hash
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ── Backend (Express) ───────────────────────────────────────────────────
  - type: web
    name: lisan-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: AI_SERVICE_INTERNAL_SECRET
        sync: false
      # Same caveat as BACKEND_URL below: hostport has no scheme.
      # Fill in manually as http://<lisan-ai-service internal address>
      # (copied from lisan-ai-service → Connect tab), e.g. http://lisan-ai-service:8000
      - key: AI_SERVICE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false          # paste the full service-account JSON as one line
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FB_WEB_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # your deployed frontend origin(s)
      - key: LOG_LEVEL
        value: info
      - key: LOG_PII_MODE
        value: hash

databases: []   # this project doesn't use Postgres — Firestore is the DB
