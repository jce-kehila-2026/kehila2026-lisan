<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lisan</title>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;text-align:center;font-family:Arial,sans-serif;color:#5d3587;padding:24px">
        <div>
          <h1 style="font-size:28px;margin:0 0 12px">Loading Lisan...</h1>
          <p style="max-width:520px;margin:0 auto;line-height:1.6;color:#756b7d">
            If this message stays on screen, open the app with the Vite dev server:
            http://localhost:5173
          </p>
        </div>
      </main>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<main style="min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;color:#5d3587;padding:24px;text-align:center">' +
          '<div><h1>React failed to load</h1><p style="color:#756b7d;max-width:620px;line-height:1.6">' +
          (event.message || 'Unknown browser error') +
          '</p></div></main>';
      });
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
