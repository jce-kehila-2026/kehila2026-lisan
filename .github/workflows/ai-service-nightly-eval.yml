name: AI Service Nightly Eval

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  local-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build local curriculum index
        run: python evals/build_curriculum_index.py
      - name: Run free deterministic eval
        env:
          CHAT_PROVIDER: fake
          DISABLE_PROVIDER_STARTUP_CHECK: "1"
        run: python evals/run_expected_behavior_eval.py
      - name: Run mixed-language eval
        env:
          CHAT_PROVIDER: fake
          DISABLE_PROVIDER_STARTUP_CHECK: "1"
        run: python evals/run_mixed_language_eval.py
      - name: Run focused tests
        env:
          CHAT_PROVIDER: fake
          DISABLE_PROVIDER_STARTUP_CHECK: "1"
        run: python -m pytest tests/test_free_quality_services.py tests/test_language_profile_trace.py
